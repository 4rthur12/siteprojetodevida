<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Objetivos da Equipe</title>
</head>
<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Objetivos da Equipe<span>_</span></h2>
        
        <div class="botoes-pessoas">
            <button class="botao-pessoa ativo">Pessoa 1</button>
            <button class="botao-pessoa">Pessoa 2</button>
            <button class="botao-pessoa">Pessoa 3</button>
        </div>

        <div class="conteudo">
            <div class="painel-pessoa ativo">
                <div class="botoes">
                    <button class="botao ativo">Objetivo 1</button>
                    <button class="botao">Objetivo 2</button>
                    <button class="botao">Objetivo 3</button>
                    <button class="botao">Objetivo 4</button>
                </div>
                <div class="abas-textos">
                    <div class="aba-conteudo ativo">
                        <h3 class="aba-conteudo-titulo-principal">Título do Objetivo 1</h3>
                        <div class="sub-abas">
                            <button class="sub-botao ativo">Tempo</button>
                            <button class="sub-botao">Como completar</button>
                        </div>
                        <div class="conteudo-sub-aba ativo">
                            <div class="contador">
                                <div class="contador-digito"><p class="contador-digito-numero">0</p><p>dias</p></div>
                                <div class="contador-digito"><p class="contador-digito-numero">0</p><p>horas</p></div>
                                <div class="contador-digito"><p class="contador-digito-numero">0</p><p>min</p></div>
                                <div class="contador-digito"><p class="contador-digito-numero">0</p><p>seg</p></div>
                            </div>
                        </div>
                        <div class="conteudo-sub-aba">
                            <p>Aqui você descreve o passo a passo para completar este objetivo.</p>
                        </div>
                    </div>
                </div>
            </div>
            </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
